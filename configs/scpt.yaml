# SCPT ViT-B/16 few-shot configuration.
DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 32
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 4
INPUT:
  SIZE: [224, 224]
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]
MODEL:
  BACKBONE:
    NAME: "ViT-B/16"
OPTIM:
  NAME: "adam"
  LR: 0.002
  WEIGHT_DECAY: 0.0005
  ADAM_EPS: 0.001
  MAX_EPOCH: 50
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 0.00001
TRAIN:
  PRINT_FREQ: 10
  CHECKPOINT_FREQ: 0
TEST:
  FINAL_MODEL: "best_val"
  SPLIT: "test"
TRAINER:
  NAME: "SCPT"
  SCPT:
    N_CTX: 4
    EXTRA_BITS: 3
    TAU: 0.3
    LOSS_WEIGHT: 8.5
    PREC: "fp16"
